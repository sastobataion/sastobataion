<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#1f7a5c">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="অ্যাডমিন">
<title>অ্যাডমিন প্যানেল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8f5;--surface:#fff;--ink:#12332e;--muted:#4f6b64;--line:#d3e2db;--leaf:#1f7a5c;--leaf-ink:#fff;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0e1f1b;--surface:#162b26;--ink:#e6f2ee;--muted:#9bb8af;--line:#2a443d;--leaf:#4fc29a;--leaf-ink:#06231a;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:17px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:20px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:12px}
input,select,textarea{display:block;width:100%;font:inherit;padding:8px 12px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:200px;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:999px;padding:6px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.main{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf);font-weight:600}
button.del{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f2b134;outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.row button{padding:4px 12px}
.btns{flex-wrap:wrap;justify-content:flex-end}
.row:first-of-type{border-top:0}
.row b{display:block;line-height:1.4}.row small{color:var(--muted)}
.btns{display:flex;gap:8px;flex-shrink:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
#msg{min-height:1.7em;font-weight:600}
.hint{color:var(--muted);font-size:15px;margin:0 0 12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div class="bar"><h1>অ্যাডমিন প্যানেল</h1><button id="out" type="button" hidden>লগআউট</button></div>
<div id="msg" role="status" aria-live="polite"></div>

<div id="login" class="card">
<h2>প্রথমবার সেটআপ</h2>
<p class="hint">টোকেন এই ডিভাইসে পাসওয়ার্ড দিয়ে তালাবন্ধ করে রাখা হবে। পরে শুধু পাসওয়ার্ড দিয়ে ঢুকবেন।</p>
<label for="o">GitHub ইউজারনেম<input id="o" autocomplete="off" autocapitalize="off" placeholder="যেমন: rahim"></label>
<label for="r">রিপোজিটরির নাম<input id="r" autocomplete="off" autocapitalize="off" placeholder="যেমন: rahim.github.io"></label>
<label for="t">অ্যাক্সেস টোকেন<input id="t" type="password" autocomplete="off" placeholder="github_pat_..."></label>
<label for="pw">নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)<input id="pw" type="password" autocomplete="new-password"></label>
<button id="go" class="main" type="button">সেটআপ করুন</button>
</div>
<div id="unl" class="card" hidden>
<h2>লগইন</h2>
<label for="up">পাসওয়ার্ড<input id="up" type="password" autocomplete="current-password"></label>
<button id="in" class="main" type="button">লগইন</button>
<button id="fg" class="del" type="button">এই ডিভাইস থেকে মুছুন</button>
</div>

<div id="app" hidden>
<div class="card"><h2 id="fh">নতুন লেখা</h2>
<label for="ti">শিরোনাম<input id="ti"></label>
<label for="ca">ক্যাটাগরি<select id="ca"><option value="food">খাবার</option><option value="sleep">ঘুম</option><option value="move">ব্যায়াম</option><option value="mind">মনের যত্ন</option><option value="safe">সুরক্ষা</option><option value="child">শিশু</option><option value="women">নারী</option><option value="elder">বয়স্ক</option><option value="chronic">দীর্ঘমেয়াদি রোগ</option></select></label>
<label for="dt">প্রকাশের তারিখ<input id="dt" type="date"></label>
<p class="hint">ভবিষ্যতের তারিখ দিলে লেখাটা ওই তারিখ থেকে সাইটে দেখাবে।</p>
<label for="au">লেখকের নাম (ঐচ্ছিক)<input id="au" placeholder="যেমন: Serajul Islam"></label>
<label for="yt">ইউটিউব ভিডিওর লিংক (ঐচ্ছিক)<input id="yt" placeholder="https://youtu.be/..."></label>
<label for="sr">তথ্যসূত্র (ঐচ্ছিক। প্রতি লাইনে একটা। লিংক থাকলে নামের পর স্পেস দিয়ে লিংক দিন)<textarea id="sr" style="min-height:80px" placeholder="বিশ্ব স্বাস্থ্য সংস্থা https://www.who.int/..."></textarea></label>
<label for="rv">পর্যালোচনাকারী চিকিৎসক (শুধু সত্যিই পর্যালোচিত হলে নাম দিন)<input id="rv"></label>
<label style="display:flex;gap:8px;align-items:center"><input id="dr" type="checkbox" style="width:auto;display:inline-block;margin:0">খসড়া (সাইটে দেখাবে না)</label>
<label for="bo">লেখা<textarea id="bo"></textarea></label>
<label for="im">ছবি (ঐচ্ছিক)<input id="im" type="file" accept="image/*"></label>
<div id="pv" hidden style="margin-bottom:12px"><img id="pi" alt="" style="max-width:100%;border-radius:8px;display:block;margin-bottom:8px"><button id="rm" type="button">ছবি সরান</button></div>
<p class="hint">নতুন অনুচ্ছেদের জন্য মাঝখানে একটা ফাঁকা লাইন দিন।</p>
<button id="save" class="main" type="button">সাইটে প্রকাশ করুন</button>
<button id="cancel" type="button" hidden>বাতিল</button>
</div>
<div class="card"><h2>সব লেখা (<span id="n">0</span>)</h2><div id="list"></div></div>
</div>
</div>

<script>
var $=function(i){return document.getElementById(i)},S={o:"",r:"",t:""},A=[],sha="",base="",ed=-1,img="",newImg="",CAT={food:"খাবার",sleep:"ঘুম",move:"ব্যায়াম",mind:"মনের যত্ন",safe:"সুরক্ষা",child:"শিশু",women:"নারী",elder:"বয়স্ক",chronic:"দীর্ঘমেয়াদি রোগ"};
function say(m,bad){var e=$("msg");e.textContent=m;e.style.color=bad?"var(--bad)":"var(--leaf)"}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";if(v==="")localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return ""}
function url(p){return "https://api.github.com/repos/"+encodeURIComponent(S.o)+"/"+encodeURIComponent(S.r)+"/contents/"+(p||"articles.json")}
function api(method,body,p){return fetch(method==="GET"?url(p)+"?t="+Date.now():url(p),{method:method,headers:{"Authorization":"Bearer "+S.t,"Accept":"application/vnd.github+json"},body:body?JSON.stringify(body):undefined}).then(function(r){if(!r.ok){var e=new Error(r.status);e.code=r.status;throw e}return r.json()})}
function dec(b){var s=atob(b.replace(/\n/g,"")),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}
function enc(t){var u=new TextEncoder().encode(t),s="";u.forEach(function(c){s+=String.fromCharCode(c)});return btoa(s)}
function why(e){return e.code===401?"টোকেন ঠিক নয় বা মেয়াদ শেষ।":e.code===403?"টোকেনের অনুমতি নেই। Contents: Read and write দিয়েছেন কি না দেখুন।":e.code===404?"রিপোজিটরি বা articles.json পাওয়া যায়নি। নাম ও ফাইল দুটোই দেখুন।":e.code===409||e.code===422?"অন্য কোথাও ফাইলটা বদলেছে। পেজ রিফ্রেশ করে আবার চেষ্টা করুন।":"ইন্টারনেট বা অন্য কোনো সমস্যা হয়েছে। আবার চেষ্টা করুন।"}
function load(){say("লোড হচ্ছে…");return api("GET").then(function(j){sha=j.sha;base=dec(j.content);A=JSON.parse(base);$("login").hidden=true;$("unl").hidden=true;$("app").hidden=false;reset();$("out").hidden=false;say("");draw();return true}).catch(function(e){say(why(e),true);gate();return false})}
function gate(){var h=!!ls("ae");$("unl").hidden=!h;$("login").hidden=h;$("app").hidden=true;$("out").hidden=true}
function b64(u){var s="";u.forEach(function(c){s+=String.fromCharCode(c)});return btoa(s)}
function ub(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function key(p,salt){return crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]).then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])})}
function lock(tok,p){var s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));return key(p,s).then(function(k){return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,new TextEncoder().encode(tok))}).then(function(c){return JSON.stringify({s:b64(s),i:b64(iv),c:b64(new Uint8Array(c))})})}
function unlock(blob,p){var o=JSON.parse(blob);return key(p,ub(o.s)).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},k,ub(o.c))}).then(function(d){return new TextDecoder().decode(d)})}
function draw(){var l=$("list");l.textContent="";$("n").textContent=A.length;A.forEach(function(a,i){var r=document.createElement("div"),d=document.createElement("div"),b=document.createElement("b"),s=document.createElement("small"),x=document.createElement("div"),e=document.createElement("button"),k=document.createElement("button");r.className="row";b.textContent=a.title;s.textContent=(CAT[a.cat]||a.cat)+(a.draft?" · খসড়া":"")+(a.date?" · "+a.date:"")+(a.img?" · ছবি আছে":"")+(a.yt?" · ভিডিও":"");d.append(b,s);x.className="btns";e.type=k.type="button";e.textContent="বদলান";k.textContent="মুছুন";k.className="del";e.onclick=function(){startEdit(i)};k.onclick=function(){if(confirm("\""+a.title+"\" লেখাটা মুছে ফেলবেন?")){A.splice(i,1);push("লেখা মুছে ফেলা হয়েছে।")}};var u=document.createElement("button"),dn=document.createElement("button");u.type=dn.type="button";u.textContent="↑";dn.textContent="↓";u.setAttribute("aria-label","উপরে নিন");dn.setAttribute("aria-label","নিচে নিন");u.onclick=function(){mv(i,-1)};dn.onclick=function(){mv(i,1)};x.append(u,dn,e,k);r.append(d,x);l.appendChild(r)})}
function aid(a){if(a.id)return a.id;var x=5381,t=a.title;for(var i=0;i<t.length;i++)x=((x<<5)+x+t.charCodeAt(i))|0;return"a"+(x>>>0).toString(36)}
function psrc(t){return t.split(/\n/).map(function(l){l=l.trim();if(!l)return null;var m=l.match(/https:\/\/\S+/);return m?{t:l.replace(m[0],"").trim()||m[0],u:m[0]}:{t:l}}).filter(Boolean)}
function today(){var t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function ytid(u){u=u.trim();if(!u)return"";var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u)?u:"")}
function mv(i,d){var j=i+d;if(j<0||j>=A.length)return;var t=A[i];A[i]=A[j];A[j]=t;push("ক্রম বদলানো হয়েছে।")}
function startEdit(i){ed=i;$("fh").textContent="লেখা বদলান";$("ti").value=A[i].title;$("ca").value=A[i].cat;$("bo").value=A[i].body.join("\n\n");$("dt").value=A[i].date||"";$("au").value=A[i].author||"";$("yt").value=A[i].yt?"https://youtu.be/"+A[i].yt:"";$("dr").checked=!!A[i].draft;$("sr").value=(A[i].src||[]).map(function(x){return x.t+(x.u?" "+x.u:"")}).join("\n");$("rv").value=A[i].rev||"";img=A[i].img||"";newImg="";showPv(img);$("cancel").hidden=false;window.scrollTo(0,0)}
function reset(){ed=-1;$("dt").value=today();$("au").value=ls("au");$("yt").value="";$("dr").checked=false;$("sr").value="";$("rv").value="";img="";newImg="";showPv("");$("im").value="";$("fh").textContent="নতুন লেখা";$("ti").value="";$("bo").value="";$("ca").value="food";$("cancel").hidden=true}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function put(n){var c=JSON.stringify(A,null,1);return api("PUT",{message:"Update articles",content:enc(c),sha:sha}).then(function(j){sha=j.content.sha;base=c}).catch(function(e){if((e.code===409||e.code===422)&&n>0){return wait(1500).then(function(){return api("GET")}).then(function(j){var r=dec(j.content);if(r===c){sha=j.sha;base=c;return}if(r!==base)throw e;sha=j.sha;return put(n-1)})}throw e})}
function push(ok){say("প্রকাশ হচ্ছে…");return put(3).then(function(){draw();say(ok+" ১-২ মিনিটে সাইটে দেখা যাবে।")}).catch(function(e){say(why(e),true);load()})}
function upImg(c,k){var p="images/"+Date.now()+".jpg";return api("PUT",{message:"Add image",content:c},p).then(function(){return p}).catch(function(x){if((x.code===409||x.code===422)&&k>0)return wait(1500).then(function(){return upImg(c,k-1)});throw x})}
function showPv(src){$("pv").hidden=!src;if(src)$("pi").src=src}
$("im").onchange=function(){var f=this.files[0];if(!f)return;var u=URL.createObjectURL(f),i=new Image();i.onload=function(){var w=Math.min(1000,i.width),h=Math.round(i.height*w/i.width),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(i,0,0,w,h);var d=c.toDataURL("image/jpeg",0.8);newImg=d.split(",")[1];showPv(d);URL.revokeObjectURL(u)};i.onerror=function(){say("এই ছবিটা খোলা যায়নি।",true)};i.src=u};
$("rm").onclick=function(){img="";newImg="";$("im").value="";showPv("")};
$("save").onclick=function(){var t=$("ti").value.trim(),b=$("bo").value.split(/\n\s*\n/).map(function(p){return p.trim()}).filter(Boolean);if(!t||!b.length){say("শিরোনাম ও লেখা দুটোই দিন।",true);return}
var a={cat:$("ca").value,title:t,body:b},yv=$("yt").value.trim(),y=ytid(yv);if(yv&&!y){say("ইউটিউব লিংকটা চেনা যায়নি।",true);return}var dv=$("dt").value,au=$("au").value.trim();if(dv)a.date=dv;if(au){a.author=au;ls("au",au)}if(y)a.yt=y;var sr=psrc($("sr").value);if(sr.length)a.src=sr;var rv=$("rv").value.trim();if(rv)a.rev=rv;if($("dr").checked)a.draft=true;var e=ed,m=e>=0?"লেখা বদলানো হয়েছে।":"নতুন লেখা যোগ হয়েছে।",n=newImg,old=img;
function fin(p){if(p)a.img=p;a.id=e>=0?aid(A[e]):"n"+Date.now().toString(36);if(e>=0)A[e]=a;else A.unshift(a);reset();push(m)}
if(n){say("ছবি আপলোড হচ্ছে…");upImg(n,3).then(function(p){return wait(1200).then(function(){fin(p)})}).catch(function(x){say(why(x),true)})}else fin(old)};
$("cancel").onclick=reset;
$("go").onclick=function(){var o=$("o").value.trim(),r=$("r").value.trim(),t=$("t").value.trim(),p=$("pw").value,pp=r.replace(/^https?:\/\//,"").split("/").filter(Boolean);if(pp.length>1){r=pp[1]}else if(pp.length===1){r=pp[0]}if(!o||!r||!t||!p){say("সবগুলো ঘর পূরণ করুন।",true);return}if(p.length<8){say("পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের দিন।",true);return}S.o=o;S.r=r;S.t=t;load().then(function(ok){if(!ok)return;return lock(t,p).then(function(b){ls("ae",b);ls("ao",o);ls("ar",r);$("t").value="";$("pw").value="";say("সেটআপ হয়েছে। এখন থেকে পাসওয়ার্ড দিয়ে ঢুকবেন।")})}).catch(function(){say("এই ব্রাউজারে সেটআপ করা যাচ্ছে না।",true)})};
$("in").onclick=function(){var b=ls("ae"),p=$("up").value;if(!p)return;S.o=ls("ao");S.r=ls("ar");say("খোলা হচ্ছে…");unlock(b,p).then(function(t){S.t=t;$("up").value="";return load()}).catch(function(){say("পাসওয়ার্ড ঠিক নয়।",true)})};
$("fg").onclick=function(){if(confirm("এই ডিভাইস থেকে সেভ করা টোকেন মুছে ফেলবেন? আবার সেটআপ করতে হবে।")){ls("ae","");S.t="";gate();say("মুছে ফেলা হয়েছে।")}};
$("out").onclick=function(){S.t="";A=[];gate();say("লগআউট হয়েছে।")};
["up","pw"].forEach(function(i){$(i).onkeydown=function(e){if(e.key==="Enter")$(i==="up"?"in":"go").click()}});
ls("at","");$("o").value=ls("ao");$("r").value=ls("ar");gate();
</script>
<button id="inst" type="button" hidden style="position:fixed;right:16px;bottom:16px;z-index:9;background:var(--leaf);color:var(--leaf-ink);border:0;padding:10px 20px;box-shadow:0 2px 8px rgba(0,0,0,.25)">অ্যাপ ইনস্টল করুন</button>
<script>
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
(function(){var d,b=document.getElementById("inst");
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();d=e;b.hidden=false});
b.onclick=function(){if(!d)return;d.prompt();d.userChoice.then(function(){d=null;b.hidden=true})};
window.addEventListener("appinstalled",function(){b.hidden=true});})();
</script>
</body>
</html>
