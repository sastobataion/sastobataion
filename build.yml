name: Build article pages

on:
  push:
    branches: [main]
    paths:
      - articles.json
      - build.py
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pages
        run: python3 build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A a sitemap.xml
          if [ -f videos.json ]; then git add videos.json; fi
          git diff --cached --quiet || (git commit -m "Build article pages" && git push)
