<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>পেজ পাওয়া যায়নি – স্বাস্থ্য বাতায়ন টিপস</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Noto+Serif+Bengali:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f4;--ink:#14201d;--mu:#55665f;--br:#1f7a5c;--bi:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1815;--ink:#e8f1ed;--mu:#9db3aa;--br:#4fc29a;--bi:#06231a}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:18px;line-height:1.7;text-align:center;padding:20px}
img{width:72px;height:72px}
h1{font-family:"Noto Serif Bengali",serif;font-size:30px;font-weight:800;margin:12px 0 6px}
p{color:var(--mu);margin:0 0 18px}
a{display:inline-block;background:var(--br);color:var(--bi);border-radius:999px;padding:8px 26px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
<img src="/logo.svg" alt="">
<h1>পেজটি পাওয়া যায়নি</h1>
<p>লিংকটা ভুল হতে পারে, অথবা পেজটি সরিয়ে ফেলা হয়েছে।</p>
<a href="/">হোম পেজে ফিরে যান</a>
</main>
</body>
</html>
